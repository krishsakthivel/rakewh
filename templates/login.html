{% extends "base.html" %}
{% block title %}welcome back - rake{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-header">
      <h1>welcome back twin</h1>
      <p>no account yet? <a href="{{ url_for('auth.signup') }}">sign up for free</a></p>
    </div>
    <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="field">
        <label>email address</label>
        <input type="email" name="email" placeholder="you@school.edu" required autofocus>
      </div>
      <div class="field">
        <label>password</label>
        <input type="password" name="password" placeholder="your password" required>
      </div>
      <button type="submit" class="btn-primary btn-full">sign in</button>
    </form>
  </div>
</div>
{% endblock %}
